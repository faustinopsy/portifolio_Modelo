<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'unsafe-inline';
    img-src 'self' data: ;
    style-src 'self' 'unsafe-inline';
    font-src 'self' ;
    connect-src 'self' ;
    worker-src 'self';
    manifest-src 'self'; 
    child-src 'self' ;
    frame-src 'self' https://www.google.com/;
    upgrade-insecure-requests;
    ">
  <title>vCard - Personal Portfolio</title>
  <link async rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link async rel="stylesheet" href="./assets/css/app.css">
  <meta name="theme-color" content="#000000">
	<link rel="manifest" href="./manifest.json">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
  <Script>
  const worker = new Worker('./worker.js');
  window.workX = worker
  workX.postMessage({ type: 'fetchData' });
  window.urlsJson = []
  workX.addEventListener('message', async (event) => {
            const { type, data, error } = event.data;
            if (type === 'dadosJson') {
              if (data) {
                urlsJson = await data
              }
            } else if (type === 'error') {
              console.error('Erro ao buscar estruturas:', error);
            }
    });
    async function registerService() {
      if ("serviceWorker" in navigator) {
          try {
              const registration = await navigator.serviceWorker.register("/sw.js", {
                  scope: "/",
              });
              if (registration.installing) {
                  console.log("Service worker instalando");
              } else if (registration.waiting) {
                  console.log("Service worker instalado");
              } else if (registration.active) {
                  console.log("Service worker ativo");
              }
          } catch (error) {
              console.error(`Falhou em registrar em ${error}`);
          }
      }
  }
  registerService()

  </Script>
</head>

<body>
  <main>
    <aside class="sidebar" data-sidebar></aside>

    <!--
      - #main-content
    -->

    <div class="main-content">
      <nav class="navbar" id="nav"></nav>
      <article class="about  active" data-page="about"></article>
      <article class="resume" data-page="resume"></article>
      <article class="portfolio" data-page="portfolio"></article>
      <article class="blog" data-page="blog"></article>
      <article class="contact" data-page="contact"></article>

    </div>

  </main>

  <script defer type="module" src="./assets/js/Configuracoes.js" ></script>
  <script assync type="module" src="./assets/js/App.js" ></script>
</body>

</html>
